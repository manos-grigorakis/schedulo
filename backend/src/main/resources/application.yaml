spring:
  application:
    name: schedulo

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  security:
    user:
      name: ${SPRING_SECURITY_USERNAME}
      password: ${SPRING_SECURITY_PASSWORD}
    jwt:
      secret: ${SPRING_SECURITY_JWT_SECRET}
      expiration-in-ms: 3600000 # 1h
      cookie-name: access_token
    oauth2:
      client:
        registration:
          google:
            provider: google
            client-id: ${SPRING_SECURITY_OAUTH_GOOGLE_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          microsoft:
            provider: microsoft
            client-id: ${SPRING_SECURITY_OAUTH_MICROSOFT_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH_MICROSOFT_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-name-attribute: sub
app:
  frontend:
    url: ${FRONTEND_URL}